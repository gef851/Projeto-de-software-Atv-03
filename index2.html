<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta Bairro - Registrar Necessidade</title>
    <style>
        :root {
            --primary: #1e3a8a;          /* Azul Escuro (Confiança/Institucional) */
            --primary-hover: #172554;
            --bg-app: #f8fafc;           /* Fundo claro para alto contraste */
            --bg-card: #ffffff;
            --text-main: #1e293b;        /* Texto quase preto (Excelente leitura) */
            --text-muted: #64748b;
            --border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f172a; /* Fundo escuro externo para destacar o celular */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container simulando a tela de um Smartphone */
        .phone-mockup {
            width: 100%;
            max-width: 412px;
            height: 844px;
            background-color: var(--bg-app);
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 12px solid #334155;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Cabeçalho Fixo */
        .app-header {
            background-color: var(--primary);
            color: white;
            padding: 20px 16px;
            text-align: center;
        }

        .app-header h1 {
            font-size: 20px;
            font-weight: 700;
        }

        /* Área de Rolagem do Formulário */
        .app-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .screen-title {
            font-size: 18px;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .screen-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* Estrutura dos Campos (Form Groups) */
        .form-group {
            margin-bottom: 16px;
        }

        /* Rótulos com foco em acessibilidade */
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        /* Inputs e Selects com tamanho de toque acessível */
        .form-control {
            width: 100%;
            min-height: 48px; /* Altura ideal para o toque dos dedos */
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            color: var(--text-main);
            background-color: var(--bg-card);
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
            outline: none;
        }

        textarea.form-control {
            height: auto;
            resize: none;
        }

        /* Caixa de Upload de Foto Customizada */
        .photo-upload-container {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            background-color: var(--bg-card);
            cursor: pointer;
        }

        .photo-upload-container:hover {
            border-color: var(--primary);
        }

        /* Grupo de Botões inferiores */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 24px;
        }

        .btn {
            width: 100%;
            min-height: 48px; /* Alinhado às diretrizes de alvos de toque (Target Size) */
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-back {
            background-color: transparent;
            color: var(--text-muted);
            border: 2px solid var(--border);
        }

        /* Rodapé Institucional */
        .app-footer {
            background-color: #f1f5f9;
            border-top: 1px solid var(--border);
            padding: 12px;
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="phone-mockup">
        <!-- Cabeçalho Institucional -->
        <header class="app-header">
            <h1>📍 Conecta Bairro</h1>
        </header>

        <!-- Formulário Digital -->
        <main class="app-content">
            <h2 class="screen-title">Registrar Necessidade</h2>
            <p class="screen-subtitle">Sua demanda será enviada direto ao Departamento de Planejamento.</p>

            <form id="form-demanda" onsubmit="event.preventDefault(); alert('Demanda registrada com sucesso no painel de monitoramento!');">
                
                <!-- 1. Tipo de Problema (Requisito 3) -->
                <div class="form-group">
                    <label for="tipo-problema">Tipo de Problema *</label>
                    <select id="tipo-problema" class="form-control" required>
                        <option value="">Selecione a categoria...</option>
                        <option value="asfalto">Asfalto / Buraco na Via</option>
                        <option value="iluminacao">Iluminação Pública Apagada</option>
                        <option value="limpeza">Acúmulo de Lixo ou Entulho</option>
                        <option value="calcada">Calçada Danificada / Acessibilidade</option>
                    </select>
                </div>

                <!-- 2. Localização (Requisito 2) -->
                <div class="form-group">
                    <label for="endereco">Local da Ocorrência *</label>
                    <input type="text" id="endereco" class="form-control" placeholder="Ex: Rua Direita, nº 150 (Em frente à padaria)" required>
                </div>

                <!-- 3. Descrição Curta (Requisito 4) -->
                <div class="form-group">
                    <label for="descricao">Descrição Breve *</label>
                    <textarea id="descricao" class="form-control" rows="3" placeholder="Descreva de forma simples o problema..." required></textarea>
                </div>

                <!-- 4. Fotografia Opcional (Requisito 5) -->
                <div class="form-group">
                    <label>Fotografia da Ocorrência (Opcional)</label>
                    <div class="photo-upload-container" onclick="document.getElementById('input-foto').click()">
                        <span style="font-size: 28px;">📸</span>
                        <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">Clique para anexar ou tirar foto do local</p>
                        <input type="file" id="input-foto" style="display: none;" accept="image/*">
                    </div>
                </div>

                <!-- Botões de Envio e Retorno (Navegação) -->
                <div class="action-buttons">
                    <button type="submit" class="btn btn-submit">Enviar Demanda</button>
                    <button type="button" class="btn btn-back" onclick="alert('Simula o retorno para a tela de Menu Inicial.')">Voltar para o Menu</button>
                </div>

            </form>
        </main>

        <!-- Rodapé Obrigatório -->
        <footer class="app-footer">
            Gestão e Fiscalização:<br>
            <strong>Departamento de Planejamento do Município</strong>
        </footer>
    </div>

</body>
</html>
