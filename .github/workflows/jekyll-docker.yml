name: .NET CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore src/Projeto-de-software-Atv-03/Projeto-de-software-Atv-03.sln

      - name: Build
        run: dotnet build src/Projeto-de-software-Atv-03/Projeto-de-software-Atv-03.sln --configuration Release --no-restore

      - name: Test with Coverage
        run: |
          dotnet test src/Projeto-de-software-Atv-03/Projeto-de-software-Atv-03.sln \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage"

      - name: Debug Coverage Files
        run: |
          echo "Arquivos de cobertura encontrados:"
          find . -name "coverage.cobertura.xml"

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: "**/coverage.cobertura.xml"
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: "60 80"

      - name: Add Coverage PR Comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: code-coverage-results.md
