name: .NET CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
 build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
          
      - name: Diagnóstico
        run: |
         pwd
         ls -R
         
      - name: Restore
        run: dotnet restore ./Projeto-de-software-Atv-03/Projeto-de-software-Atv-03.csproj

      - name: Test
        run: dotnet test ./Projeto-de-software-Atv-03/Projeto-de-software-Atv-03.csproj --configuration Release --no-build
        
      - name: Debug Coverage Files
        run: |
          echo "Arquivos de cobertura encontrados:"
          find . -name "coverage.cobertura.xml"
          
      - name: Install ReportGenerator
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Verify Coverage Files
        run: |
         find . -name "coverage.cobertura.xml"

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
         name: coverage-report
         path: CoverageReport

      - name: Generate HTML Coverage Report
        run: |
         reportgenerator \
         -reports:"$(find . -name 'coverage.cobertura.xml' | tr '\n' ';')" \
         -targetdir:"CoverageReport" \
         -reporttypes:"Html;MarkdownSummary;TextSummary"

      - name: Verify Generated Report
        run: |
         ls -la CoverageReport
         test -f CoverageReport/index.html
