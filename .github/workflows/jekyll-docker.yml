name: .NET CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
 build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
          
      - name: Diagnóstico
        run: |
         pwd
         ls -R
         
      - name: Restore
        run: dotnet restore ./Projeto-de-software-Atv-03/Projeto-de-software-Atv-03.csproj

      - name: Test
        run: dotnet test ./Projeto-de-software-Atv-03/Projeto-de-software-Atv-03.csproj --configuration Release --no-build
        
      - name: Debug Coverage Files
        run: |
          echo "Arquivos de cobertura encontrados:"
          find . -name "coverage.cobertura.xml"
          
      - name: Install ReportGenerator
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Verify Coverage Files
        run: |
         find . -name "coverage.cobertura.xml"

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
         name: coverage-report
         path: CoverageReport

      - name: Generate Coverage Report
        run: |
          COVERAGE_FILES=./Projeto-de-software-Atv-03/Projeto-de-software-Atv-03/Projeto-de-software-Atv-03/coverage/.cobertura.xml

          reportgenerator \
            "-reports:$COVERAGE_FILES" \
            "-targetdir:CoverageReport" \
            "-reporttypes:Html"

      - name: Validate HTML Report
        run: |
          echo "Arquivos gerados:"
          ls -R CoverageReport

          if [ ! -f CoverageReport/index.html ]; then
            echo "index.html não foi gerado"
            exit 1
          fi

      - name: Upload coverage.cobertura.xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura-xml
          path: '**/coverage.cobertura.xml'

      - name: Upload HTML Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-html
          path: CoverageReport/
