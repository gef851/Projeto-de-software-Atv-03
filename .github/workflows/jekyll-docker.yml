name: .NET CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
 build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
          
      - name: Diagnóstico
        run: |
         pwd
         ls -R
         
      - name: Restore
        run: dotnet restore ./Projeto-de-software-Atv-03/Projeto-de-software-Atv-03.csproj

      - name: Test
        run: dotnet test ./Projeto-de-software-Atv-03/Projeto-de-software-Atv-03.csproj --configuration Release --no-build
        
      - name: Debug Coverage Files
        run: |
          echo "Arquivos de cobertura encontrados:"
          find . -name "coverage.cobertura.xml"

      - name: Test with Coverage
        run: |
          dotnet test \
          --configuration Release \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults
          
      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate Coverage Report
        run: |
         reportgenerator \
         "-reports:**/coverage.cobertura.xml" \
         "-targetdir:CoverageReport" \
         "-reporttypes:Html;MarkdownSummary;TextSummary"

         - name: Code Coverage Report
           run: |
           cat CoverageReport/Summary.txt

          - name: Upload Coverage Report
            uses: actions/upload-artifact@v4
         with:
         name: coverage-report
         path: CoverageReport
